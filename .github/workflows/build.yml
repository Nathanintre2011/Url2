name: build-wasm
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Extract dan build
        run: |
          mkdir work && unzip -q luayi-wasm.zip -d work
          cd work/luayi-wasm
          sed -i 's/^emcc /em++ /' build.sh
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: luayi-site
          path: work/luayi-wasm/site/

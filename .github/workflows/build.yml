name: build-wasm
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: unzip -q luayi-wasm.zip && bash luayi-wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: luayi-site
          path: luayi-wasm/site/
